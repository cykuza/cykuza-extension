name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Identical to local `npm run gate` / git pre-push (see scripts/ci-gate.mjs).
      - run: npm run gate
        env:
          CYKUZA_GATE: '1'
